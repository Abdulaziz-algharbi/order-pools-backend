services:
  # Runs as a single-node replica set (not a standalone mongod) — Mongoose
  # sessions/transactions (see the pool-expiry and payment-confirmation
  # flows) require one; a plain standalone mongod never supports them, no
  # matter what the app does. mongo-init below turns this node into that
  # replica set the first time it comes up; every later `docker-compose up`
  # just rejoins the already-initiated set. Client URIs must add
  # `?replicaSet=rs0&directConnection=true` — see .env.example — the
  # `directConnection` half matters specifically because this node
  # advertises itself internally as `mongo:27017` (this compose network's
  # DNS name), which isn't reachable from the host; without it, the driver
  # would try to "discover" that address and fail to reconnect after the
  # initial handshake.
  # Host port stays published: the native (non-Docker) dev workflow —
  # `npm run dev` for both backend and frontend, per this repo's own
  # CLAUDE.md — connects here via `localhost:27017` outside any compose
  # network, and has no other way to reach this container. Only the
  # dockerized `backend` service needs the internal `mongo:27017` route;
  # dropping this publish for a "hardened" default would silently break
  # that native workflow every time this file changes, which isn't worth
  # it for a database that only matters locally today. Revisit when this
  # ever runs somewhere the native workflow doesn't apply (staging/prod
  # compose file, no host port there).
  mongo:
    image: mongo:6
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - data:/data/db
    ports:
      - 27017:27017
    networks:
      - internal
    healthcheck:
      test: |
        mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: initiates the replica set once, then exits. Safe to leave in
  # the stack permanently — rs.initiate() on an already-initiated set just
  # errors, which this swallows.
  mongo-init:
    image: mongo:6
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval "
          try {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
          } catch (e) {
            if (!/already initialized/.test(e.message)) throw e;
          }
        "

  mongo-express:
    image: mongo-express
    restart: always
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - internal
      - default
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: passpass
    ports:
      - 8081:8081

  # The API. No host port published — only `nginx` (same `internal`
  # network) talks to it, at backend:8000. DEV_MONGO_URI/FRONTEND_URL are
  # overridden here (docker-compose `environment:` wins over `env_file:`
  # for the same key) because inside this network the DB is reachable as
  # `mongo`, not `localhost`, and the browser-facing origin is nginx's,
  # not the bare Vite dev server's.
  backend:
    build: .
    env_file: .env
    environment:
      PORT: '8000'
      APP_MODE: DEV
      DEV_MONGO_URI: mongodb://mongo:27017/order-pool?replicaSet=rs0&directConnection=true
      FRONTEND_URL: https://localhost
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal

  # TLS termination, static frontend, and reverse proxy to `backend` — see
  # nginx.conf in order-pools-app (this build context). Requires a dev
  # cert first: run certs/generate-dev-certs.sh once before `up`; swap in
  # a real certificate before deploying anywhere but localhost.
  nginx:
    build:
      context: ../order-pools-app
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal

volumes:
  data:

networks:
  internal:
